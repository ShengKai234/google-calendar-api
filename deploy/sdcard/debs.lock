# .deb packages a fresh Raspberry Pi OS Lite (Trixie, 32-bit) card lacks:
# the libraries Pillow's piwheels wheel links against, and watchdog
# (deploy/install.sh enables it). deploy/sdcard/firstboot.sh installs them
# with dpkg, before the card has any network.
#
# Pinned with their SHA-256, so every card gets the files checked here.
# When a build fails to download one (the archive dropped that version for
# a newer one), re-pin, review the diff and commit:
#   python -m gcal_epd.build_release --refresh-debs
#
# The list is what `apt-get install --download-only` fetched for these
# packages inside the 2026-10-06 Lite image: none of their dependencies
# was missing. Re-check it when the base image changes.
archive http://raspbian.raspberrypi.com/raspbian
suite trixie
