# Calendar feeds are defined in ics_feeds.toml, which is gitignored:
# each feed URL is a bearer token. See ics_feeds.example.toml.
[[sources]]
type = "ics"
feeds_file = "ics_feeds.toml"
days_ahead = 14
max_results_per_calendar = 100

[[sources]]
type = "open_meteo"
latitude = 25.0330
longitude = 121.5654
location = "Taipei"

[display]
output_path = "preview.png"
font_path = "assets/fonts/NotoSansCJKtc-Regular.otf"

[update]
# Over-the-air updates of an installed release (docs/DEPLOYMENT.md).
# channel: "stable" takes full releases; "beta" takes pre-releases too.
# Set either per display in config.local.toml, e.g. [update] channel = "beta".
enabled = true
channel = "stable"

[power]
# Wake-up slots live in schedule_file (gitignored, edited through the setup
# form; missing = 07:00 and 19:00). The slots are wall-clock times here:
timezone = "Asia/Taipei"
schedule_file = "power_schedule.toml"
# The board that powers the Pi off and wakes it: "auto" (a PiSugar 3 if
# pisugar-server is installed), "pisugar3", or "none" (mains, always on).
board = "auto"
